# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

# Environment variables for production
# Non-sensitive values can be set directly
env:
  # Firebase Client Config (public, safe to include)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "${NEXT_PUBLIC_FIREBASE_API_KEY}"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "${NEXT_PUBLIC_FIREBASE_PROJECT_ID}"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "${NEXT_PUBLIC_FIREBASE_APP_ID}"
  
  # Emulators disabled in production
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: "false"

  # Secrets from Google Secret Manager
  # Create these secrets first: gcloud secrets create <secret-name> --data-file=-
  - variable: GOOGLE_API_KEY
    secret: google-api-key
