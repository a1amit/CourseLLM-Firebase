version: '3.8'

# Docker Compose configuration for local development
# Usage: docker-compose up --build

services:
  # ==========================================================================
  # Main Application (Next.js)
  # ==========================================================================
  app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    ports:
      - "9002:9002"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ENABLE_TEST_AUTH=${ENABLE_TEST_AUTH:-false}
    volumes:
      - ../src:/app/src:ro
      - ../public:/app/public:ro
    depends_on:
      - firebase-emulators
    networks:
      - coursellm-network

  # ==========================================================================
  # Firebase Emulators (Auth + Firestore)
  # ==========================================================================
  firebase-emulators:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "
        npm install -g firebase-tools &&
        firebase emulators:start --project demo-coursellm --only auth,firestore
      "
    ports:
      - "4000:4000"   # Emulator UI
      - "9099:9099"   # Auth emulator
      - "8080:8080"   # Firestore emulator
    volumes:
      - ../firebase.json:/app/firebase.json:ro
      - ../.firebaserc:/app/.firebaserc:ro
    networks:
      - coursellm-network

networks:
  coursellm-network:
    driver: bridge

